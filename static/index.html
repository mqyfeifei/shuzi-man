<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>景区数字人内容工作台</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><small>SCENIC DIGITAL GUIDE</small><h1>景区数字人内容工作台</h1><p>预置问答 · 豆包配音 · MuseTalk 视频</p></div><span id="health" class="badge">检测服务</span></header><main>
<section class="steps"><span class="on">1 选择景区与回答</span><span>2 生成并保存音频</span><span>3 上传人物素材</span><span>4 合成数字人视频</span></section>
<section class="panel"><label>景区</label><div id="spots" class="tabs"></div></section><div class="layout"><section class="panel"><div class="title"><h2>预测问答</h2><span id="count"></span></div><div id="qa" class="qa"></div></section>
<aside class="panel sticky"><h2>内容资产链</h2><div id="empty" class="empty">从左侧选择一条问答</div><div id="workspace" hidden><h3 id="question"></h3><p id="answer" class="answer"></p><label>合成音色</label><select id="voices"></select><p id="voiceInfo" class="hint"></p><button id="tts" class="primary">生成答案语音</button><p class="hint">生成结果将永久保存到 data/audio</p><label>已生成音频</label><select id="audios"></select><audio id="player" controls></audio><label>数字人图片 / 无声视频</label><input id="file" type="file" accept=".jpg,.jpeg,.png,.mp4"><button id="upload">上传素材</button><select id="materials"></select><details><summary>高级合成参数</summary><label><input id="enhance" type="checkbox" checked> GFPGAN 面部增强</label><label>融合权重 <input id="weight" type="number" min="0" max="1" step="0.1" value="0.5"></label><label>检测框纵向偏移 <input id="shift" type="number" value="0"></label></details><button id="video" class="accent">生成数字人视频</button><div id="videos"></div></div></aside></div></main><div id="toast"></div><script src="/app.js"></script></body></html>
